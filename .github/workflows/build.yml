name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # الـ SDK موجود مسبقاً على سيرفر GitHub، نقبل التراخيص بس
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Restore signing key (if secrets are set)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/tajmi3.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/tajmi3.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASS=${{ secrets.KEYSTORE_PASS }}" >> "$GITHUB_ENV"
          else
            echo "No signing secrets, using default debug key"
          fi

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/*.apk tajmi3.apk

      - uses: actions/upload-artifact@v4
        with:
          name: tajmi3-apk
          path: tajmi3.apk

      # رابط تحميل مباشر ثابت للـ APK (صفحة Releases)
      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: tajmi3 (latest APK)
          body: "آخر نسخة APK. نزّل tajmi3.apk وثبّته."
          files: tajmi3.apk
          make_latest: true
